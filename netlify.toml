# Deploy de La Casa del Lago Urugua-í (Next.js 16) en Netlify.
# El deploy se hace desde esta carpeta (la-casa-del-lago-web) como base del sitio.
[build]
  # Invocamos Next directo con Node (no "pnpm build") para saltear el chequeo de
  # dependencias de pnpm v11, que en Windows falla por build scripts "ignorados".
  command = "node ./node_modules/next/dist/bin/next build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

  # El remitente de email (CDL_EMAIL_FROM) no es sensible: viaja en claro en cada
  # mail que llega al huésped. Lo excluimos del scanner de secretos para que no
  # marque el fallback de `client.ts` ni el ejemplo de `.env.example`.
  SECRETS_SCAN_OMIT_KEYS = "CDL_EMAIL_FROM"

  # Fotos del lodge. Las dos van acá y no en el panel de Netlify porque ninguna
  # es un secreto: la URL del proyecto Supabase viaja igual en el bundle público
  # de cualquier deploy, y el flag es un booleano. Al vivir en el repo, un deploy
  # limpio ya sale con las fotos, sin configurar nada a mano.
  #
  # Las credenciales (SUPABASE_SERVICE_ROLE_KEY, las de Mercado Pago, RESEND_API_KEY)
  # NO van acá: esas se cargan en el panel de Netlify y nunca en el repositorio.
  NEXT_PUBLIC_SUPABASE_URL = "https://aqknzqtxhgsrhfaskoeo.supabase.co"
  # En "1" desde que el bucket público `imagenes` tiene las fotos arriba.
  NEXT_PUBLIC_PHOTOS_BUCKET_READY = "1"

# Runtime oficial de Next.js en Netlify (SSR, API routes, ISR).
[[plugins]]
  package = "@netlify/plugin-nextjs"
